<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Base building body -->
  <rect x="6" y="14" width="20" height="14" rx="1" fill="#89b4fa"/>
  <!-- Tower body -->
  <rect x="18" y="6" width="8" height="22" rx="1" fill="#89b4fa"/>
  <!-- Tower roof -->
  <polygon points="18,6 22,2 26,6" fill="#b4befe"/>
  <!-- Main roof -->
  <polygon points="6,14 16,6 26,14" fill="#b4befe"/>
  <!-- Door -->
  <rect x="12" y="20" width="4" height="8" rx="2" fill="#1e1e2e"/>
  <!-- Window on tower -->
  <rect x="20" y="10" width="4" height="4" rx="1" fill="#1e1e2e"/>
  <!-- Base shadow/ground -->
  <rect x="4" y="28" width="24" height="2" rx="1" fill="#313244"/>
</svg>
